<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keep</title>
  <style>
    html, body { margin: 0; height: 100%; background: #efe8d8; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* The real controls sit invisibly on top of their drawn versions, so typing, paste,
       mobile keyboards and screen readers all work the normal way. */
    #pw, #eye { position: fixed; opacity: 0; margin: 0; padding: 0; border: 0; background: none; }
    #pw { font-size: 16px; cursor: text; caret-color: transparent; }
    #eye { cursor: pointer; }
    body.scripted #pw, body.scripted #eye { display: none; }
    body.scripted canvas { cursor: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <input id="pw" type="password" maxlength="40" aria-label="Password" aria-describedby="verdict"
         autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="eye" type="button" aria-label="Show password" aria-pressed="false"></button>
  <p id="verdict" class="sr" aria-live="polite"></p>
  <script type="module" src="app.js"></script>
</body>
</html>
