<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060b; }
    body { display: grid; place-items: center; }
    canvas { image-rendering: pixelated; border: 3px solid #201b28; border-radius: 14px; max-width: calc(100vw - 16px); height: auto; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="stage" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
