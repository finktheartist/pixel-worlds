<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoard</title>
<style>
  :root { --ink: #26221c; --page: #efe8d8; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; }
  main { width: min(720px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { font: 700 22px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 6px; margin: 0; }
  .sub { margin: 4px 0 30px; color: #685f50; }
  .hint { margin: 26px 4px 0; color: #685f50; }
  .again { margin: 10px 4px 0; }
  .again button { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .embed body { place-items: start center; min-height: 0; } .embed main { width: calc(100vw - 8px); padding: 6px 0 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed .again { margin-top: 22px; }
</style>
</head>
<body>
<main>
  <h1>HOARD</h1>
  <p class="sub">A hold-to-delete button with a dragon in it.</p>
  <hoard-button id="hoard" heading="Delete “Untitled-7”" warning="This can’t be undone." done-heading="“Untitled-7” deleted" done-warning="It is gone."></hoard-button>
  <p class="hint">Press and hold the button for about two seconds. Let go early and nothing is deleted.</p>
  <p class="again" hidden><button type="button">Put it back</button></p>
</main>
<script src="hoard.js"></script>
<script>
// This page's own wiring. The component is all in hoard.js.
const Q = new URLSearchParams(location.search), hoard = document.getElementById('hoard'), again = document.querySelector('.again');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');   // inside the gallery: no heading of its own
hoard.addEventListener('hoard:delete', () => setTimeout(() => { again.hidden = false; }, 500));   // this is where a real page would do the delete
again.querySelector('button').addEventListener('click', () => { hoard.reset(); again.hidden = true; hoard.focus({ preventScroll: true }); });
if (Q.get('film') === '1') {   // a scripted take, stepped a frame at a time: hover, hold and let go early, then hold to the end
  customElements.get('hoard-button').paused = true;
  const SCRIPT = [[0.9, 'hover', true], [1.8, 'down', true], [2.75, 'down', false], [5.3, 'down', true], [7.3, 'down', false], [8.0, 'hover', false]];
  let t = 0; const step = (fps) => { for (const [at, key, val] of SCRIPT) if (t < at && t + 1 / fps >= at) hoard.input[key] = val; t += 1 / fps; hoard.advance(1 / fps); };
  window.__film = { duration: 12, step, seek(to, fps = 60) { while (t < to) step(fps); } };
  if (Q.get('seek')) window.__film.seek(parseFloat(Q.get('seek')));
}
</script>
</body>
</html>
